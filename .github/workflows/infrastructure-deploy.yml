name: Infrastructure Deploy

on:
  workflow_dispatch:

#  push:
#    branches:
#      - main

env:
  TF_VERSION: "1.13.3"
  AWS_REGION: "eu-west-2"

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: |
            terraform/.terraform
            ~/.terraform.d/plugin-cache
          key: terraform-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: terraform-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      - name: Terraform Plan
        env:
          TF_VAR_name: ${{ secrets.TF_VAR_NAME }}
          TF_VAR_aws_region: ${{ secrets.TF_VAR_AWS_REGION }}
          TF_VAR_vpc_cidr: ${{ secrets.TF_VAR_VPC_CIDR }}
          TF_VAR_public_subnet_cidrs: ${{ secrets.TF_VAR_PUBLIC_SUBNET_CIDRS }}
          TF_VAR_private_subnet_cidrs: ${{ secrets.TF_VAR_PRIVATE_SUBNET_CIDRS }}
          TF_VAR_instance_type: ${{ secrets.TF_VAR_INSTANCE_TYPE }}
          TF_VAR_dockerhub_image: ${{ secrets.TF_VAR_DOCKERHUB_IMAGE }}
          TF_VAR_mongo_uri: ${{ secrets.TF_VAR_MONGO_URI }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
        run: terraform plan -input=false -parallelism=20

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TF_VAR_name: ${{ secrets.TF_VAR_NAME }}
          TF_VAR_aws_region: ${{ secrets.TF_VAR_AWS_REGION }}
          TF_VAR_vpc_cidr: ${{ secrets.TF_VAR_VPC_CIDR }}
          TF_VAR_public_subnet_cidrs: ${{ secrets.TF_VAR_PUBLIC_SUBNET_CIDRS }}
          TF_VAR_private_subnet_cidrs: ${{ secrets.TF_VAR_PRIVATE_SUBNET_CIDRS }}
          TF_VAR_instance_type: ${{ secrets.TF_VAR_INSTANCE_TYPE }}
          TF_VAR_dockerhub_image: ${{ secrets.TF_VAR_DOCKERHUB_IMAGE }}
          TF_VAR_mongo_uri: ${{ secrets.TF_VAR_MONGO_URI }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
        run: terraform apply -auto-approve -input=false -parallelism=20

      - name: Set GitHub Secrets in Application Repo
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Get terraform outputs
          CF_DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          ASG_NAME=$(terraform output -raw asg_name)

          # Set GitHub secrets
          gh secret set CLOUDFRONT_DISTRIBUTION_ID --body "$CF_DIST_ID" --repo Ife-Olaitan/starttech-application
          gh secret set ASG_NAME --body "$ASG_NAME" --repo Ife-Olaitan/starttech-application


